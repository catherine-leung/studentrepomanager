  <circle cx="14" cy="25" r="2.4" fill="#ffffff" />
  <circle cx="23" cy="19" r="2.2" fill="#ffffff" />

  <!-- mortarboard -->
  <path d="M14 2.2 L19.6 6 L14 9.8 L8.4 6 Z" fill="#ffffff" />
  <rect x="11.6" y="6.6" width="4.8" height="2.6" rx="0.8"
